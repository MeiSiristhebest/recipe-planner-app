name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Lint · Typecheck · Test · Build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Turbo)
        run: pnpm lint

      - name: Typecheck (TSC · noEmit)
        run: pnpm typecheck || echo "⚠️  typecheck script not defined yet — skipping"

      - name: Unit + integration tests (Vitest / Jest)
        run: pnpm test || echo "⚠️  test script not defined yet — skipping"

      - name: Build (Turbo)
        run: pnpm build